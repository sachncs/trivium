<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glow1" cx="200" cy="100" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca" stop-opacity="0.6" />
      <stop offset="1" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="1000" cy="500" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5b4fc" />
      <stop offset="0.5" stop-color="#fb923c" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca" />
      <stop offset="0.5" stop-color="#6366f1" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1" />
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1" />
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="1" />
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="1" />
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="1" />
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="1" />
  </g>

  <!-- Logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="url(#markGrad)" />
  <text x="160" y="125" fill="white" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">trivium</text>

  <!-- Main headline -->
  <text x="80" y="280" fill="white" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">The reproducible</text>
  <text x="80" y="370" fill="url(#textGrad)" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">hybrid search benchmark.</text>

  <!-- Subheadline -->
  <text x="80" y="440" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400" letter-spacing="-0.5">BM25 + dense vector + RRF + cross-encoder rerank on BEIR scifact.</text>

  <!-- Stats -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="200" height="80" rx="12" fill="#1e293b" opacity="0.6" stroke="#334155" />
    <text x="20" y="35" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">+0.045</text>
    <text x="20" y="58" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">nDCG@10 over BM25</text>

    <rect x="220" y="0" width="200" height="80" rx="12" fill="#1e293b" opacity="0.6" stroke="#334155" />
    <text x="240" y="35" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">0.7016</text>
    <text x="240" y="58" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">hybrid_rrf · 5K scifact</text>

    <rect x="440" y="0" width="200" height="80" rx="12" fill="#1e293b" opacity="0.6" stroke="#334155" />
    <text x="460" y="35" fill="#fb923c" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">0.6789</text>
    <text x="460" y="58" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">BM25 pre-flight ±0.03</text>

    <rect x="660" y="0" width="200" height="80" rx="12" fill="#1e293b" opacity="0.6" stroke="#334155" />
    <text x="680" y="35" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">101</text>
    <text x="680" y="58" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">tests passing</text>
  </g>
</svg>