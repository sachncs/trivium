<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="trivium logo">
  <title>trivium</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- BM25 dot -->
  <circle cx="148" cy="146" r="26" fill="#ffffff" opacity="0.85"/>
  <!-- Vector cluster -->
  <circle cx="232" cy="148" r="14" fill="#ffffff" opacity="0.55"/>
  <circle cx="270" cy="166" r="14" fill="#ffffff" opacity="0.55"/>
  <circle cx="296" cy="132" r="14" fill="#ffffff" opacity="0.55"/>
  <!-- Central hub -->
  <circle cx="200" cy="256" r="46" fill="url(#accent)"/>
  <text x="200" y="276" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" fill="#ffffff">t</text>
  <!-- Result cluster -->
  <circle cx="384" cy="232" r="18" fill="#ffffff" opacity="0.85"/>
  <circle cx="392" cy="288" r="22" fill="#ffffff" opacity="0.95"/>
  <circle cx="356" cy="328" r="16" fill="#ffffff" opacity="0.7"/>
  <!-- Connector lines -->
  <path d="M 174 168 Q 192 210 184 230" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 246 240 Q 300 240 360 250" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 230 290 Q 290 320 340 320" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="50%" y="450" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-2">trivium</text>
</svg>
