version: 1

corpus:
  seed: scifact
  distractors:
    - scidocs
    - trec-covid
    - nfcorpus
  # FEVER is sampled to pad to 1M. The three BEIR scientific corpora
  # already give ~200K distractor candidates; 800K more from FEVER
  # plus ~5K scifact = ~1M total.
  fever_sample: 800000
  seed_random: 42
  dedup_jaccard_threshold: 0.85

scales: [5000, 100000, 500000, 1000000]
# smaller scales are subsumed by larger ones — 100k is a prefix of 500k and 1M.
# 5K is the untouched scifact seed (no distractors) and runs the equivalence check.

embedding:
  # Trade-off: MiniLM-L6 over mpnet-base for ~5x speed on CPU.
  # 384d not 768d. Hits BGE-small quality, not BGE-large.
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
  batch_size: 128
  normalize: true
  max_seq_length: 256

encoders:
  # Default encoder for the 1M-scale DiskBBQ benchmark: 90 MB model,
  # 384d, l2-normalised, ~5x faster than mpnet-base on CPU.
  - slug: minilm-l6
    model_id: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384
    device: cpu
    batch_size: 128
    max_seq_length: 256
    normalize: true

bm25:
  # k1=0.9, b=0.4 is the Anserini default that reproduces beir-v1.0.0-scifact nDCG@10=0.6789
  method: lucene
  k1: 0.9
  b: 0.4
  candidate_pool: 100

vector:
  # FAISS OPQ-IVF-PQ FastScan + exact refinement.
  # Performance: ~55 bytes/vec at 4-bit PQ. Recovers ~+5-10% ann recall vs plain IVFPQ.
  # nlist follows 4*sqrt(N) rounded to power of 2 (FAISS wiki).
  # 5000 -> 4*sqrt(5000)=283 -> 512; the pipeline uses IndexFlatIP at this scale,
  # so the literal value is harmless.
  # 100000 -> 4*sqrt(100000)=1265 -> 2048
  # 500000 -> 4*sqrt(500000)=2828 -> 4096
  # 1000000 -> 4*sqrt(1000000)=4000 -> 4096 (capped to keep coarse-training O(N))
  nlist_by_scale:
    5000: 512
    100000: 2048
    500000: 4096
    1000000: 4096
  nprobe: [8, 16, 32, 64, 128, 256]
  m: 48               # 384 / 48 = 8 dims per subquantizer
  nbits: 4
  use_opq: true
  use_rflat: true
  # k_factor for RFlat (how many approximate neighbors to exactly rescore).
  # 4 = rerank 4x more than k. Default FAISS recommendation.
  k_factor: 4

hybrid:
  rrf_k: 60
  rrf_k_sweep: [10, 30, 60, 100, 200]
  rrf_weight_sweep: [[0.5, 0.5], [0.3, 0.7], [0.7, 0.3]]
  candidate_pool: 100

rerank:
  # cross-encoder/ms-marco-MiniLM-L-6-v2 — accepted +0.023 lift cap.
  # bge-reranker-base would lift +5-8 but at 450MB and slower CPU.
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_length: 256
  batch_size: 32
  candidate_pool: 50     # smaller than hybrid.candidate_pool because CE is expensive

benchmark:
  # Per query, single-stream, after 20-query warmup.
  warmup: 20
  iters: 3
  top_k_eval: [10, 100]

preflight:
  # BM25 nDCG@10 on untouched 5K scifact must match this within tolerance.
  # Anserini beir-v1.0.0-scifact flat: 0.6789 (BEIR paper Thakur 2021).
  # bm25s runs ~0.02-0.03 lower than Anserini on small corpora due to
  # implementation drift (Lucene BM25 vs bm25s "lucene" method).
  # Documented difference: tokenizer detail, IDF formula, length normalization.
  target_ndcg10: 0.6789
  tolerance: 0.03
  min_observed: 0.62      # absolute lower bound; below this is a real bug

# Reproducibility manifest — every CSV row records these.
runtime:
  random_seed: 42
  python_hash_seed: 42
  faiss_omp_threads: 1
