[mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["faiss.*", "bm25s.*", "pytrec_eval.*", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["trivium.*"]
strict = true

[tool.mypy.exclude_module]
# Skip the legacy modules during the migration. They get stricter
# treatment as each file is ported into trivium/.
module_path = "bench/.*|search/.*|data/.*"
ignore_errors = true
