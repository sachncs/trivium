[mypy]
python_version = 3.12
files = trivium/config, trivium/domain, trivium/evaluation/latency.py, trivium/evaluation/metrics.py, trivium/fusion, trivium/io/corpus.py, trivium/io/embeddings.py, trivium/pipelines/base.py, trivium/pipelines/helpers.py, trivium/reporting/csv_writer.py, trivium/retrieval/base.py, trivium/tokenizer/gigatoken.py
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
follow_imports = skip

# Optional native/model integrations are checked by adapter contracts and
# runtime tests; their third-party packages do not ship complete type data.
exclude = ^trivium/(cli|data_prep)/|^trivium/(embeddings/(e5|sentence|registry)|reranking/(bge|encoder|monot5))/|^trivium/(retrieval/(faiss|diskbbq|bm25)|evaluation/ground_truth)/|^trivium/pipelines/|^trivium/(io/manifest|reporting/summariser|reproducibility)/|^trivium/.*/registry\.py$
